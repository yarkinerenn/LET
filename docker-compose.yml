version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: auth_app
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/auth_app
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-your-secret-key-change-in-production}
      - FLASK_DEBUG=1
      - PORT=5000
      - FRONTEND_ORIGIN=http://localhost:3000
      - SESSION_COOKIE_NAME=let_session
      - UPLOAD_FOLDER=uploads
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    develop:
      watch:
        - action: rebuild
          path: ./backend/requirements.txt

  frontend:
    build:
      context: ./explainable-nlp
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./explainable-nlp/src:/app/src
      - ./explainable-nlp/public:/app/public
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network
    stdin_open: true
    tty: true
    develop:
      watch:
        - action: rebuild
          path: ./explainable-nlp/package.json

volumes:
  mongodb_data:
    driver: local

networks:
  app-network:
    driver: bridge

